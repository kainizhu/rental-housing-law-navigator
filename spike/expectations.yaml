# Hand-written expectations. Written BEFORE any model output exists.
# Sources: challenge brief (category table, illustrative output, T1-T6), README §4.1/§7/§9,
# and direct reading of corpus/supplemental text. Never fed into prompts.
# "silver" = best available evidence, not ground truth.

meta:
  default_as_of: "2026-10-01"
  assumptions:            # switchable; proxy evaluator reports results under each
    ma_40p_in_lookups: [applies, omit]          # default: applies (miss costs 2x)
    unknown_credit: [0.0, 0.25, 0.5]
    citation_match: [strict, loose]
    nj_4c_implies_5plus_units: [hint_only, supported]   # default hint_only
    allow_supplemental_spans: [true, false]

